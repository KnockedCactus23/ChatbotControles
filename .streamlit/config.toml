# Identidad "Pizarra cálida" (Día) y "Grafito" (Noche), del mockup aprobado (mockup/resumen.html).
# Los hex salen de los tokens OKLCH de chatbot/ui.py. El tema se cambia con el selector Día/Noche de la barra lateral;
# sin elección, sigue el del sistema operativo.
[theme]
baseRadius = "6px"
buttonRadius = "6px"
baseFontSize = 14
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
headingFont = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
codeFont = "Geist Mono:https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap"
headingFontWeights = [600, 600, 600, 600, 600, 600]
showWidgetBorder = true

[theme.light]
primaryColor = "#386173"          # accent
backgroundColor = "#efece8"       # paper
secondaryBackgroundColor = "#e6e4df"  # sunken
textColor = "#23272c"             # ink
borderColor = "#bab7b2"           # rule-2
linkColor = "#386173"
redColor = "#ac5e4e"              # st-no_implementado
orangeColor = "#c29a5a"           # st-parcial
greenColor = "#528869"            # st-implementado
blueColor = "#386173"
violetColor = "#71757a"
grayColor = "#71757a"             # st-no_verificado

[theme.light.sidebar]
backgroundColor = "#e9e7e2"       # side
secondaryBackgroundColor = "#f7f6f2"  # surface
borderColor = "#d8d5d1"           # rule

[theme.dark]
primaryColor = "#7cb5c8"          # accent (texto oscuro encima: on-accent)
backgroundColor = "#161719"       # paper
secondaryBackgroundColor = "#1d1f22"  # surface
textColor = "#e8e6e2"             # ink
borderColor = "#404346"           # rule-2
linkColor = "#7cb5c8"
redColor = "#d37e6c"
orangeColor = "#d7b16f"
greenColor = "#6faf8a"
blueColor = "#7cb5c8"
violetColor = "#82878c"
grayColor = "#82878c"

[theme.dark.sidebar]
backgroundColor = "#1a1c1f"       # side
secondaryBackgroundColor = "#1d1f22"  # surface
borderColor = "#2c2e31"           # rule

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
