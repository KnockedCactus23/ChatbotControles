# Identidad "Dictamen técnico" (sistema de diseño Centinela IG1): tema Día y tema Noche.
# Los hex salen de los tokens OKLCH de chatbot/ui.py. El tema se cambia con el selector Día/Noche de la barra lateral;
# sin elección, sigue el del sistema operativo.
[theme]
baseRadius = "6px"
buttonRadius = "6px"
baseFontSize = 15
font = "Public Sans:https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&display=swap"
headingFont = "Newsreader:https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
headingFontWeights = [500, 500, 500, 600, 600, 600]
showWidgetBorder = true

[theme.light]
primaryColor = "#00657f"          # accent
backgroundColor = "#f7fafc"       # paper
secondaryBackgroundColor = "#eff3f6"  # sunken
textColor = "#121e2b"             # ink
borderColor = "#c0c9ce"           # rule-strong
linkColor = "#00657f"
redColor = "#bd3933"              # st-no_implementado
orangeColor = "#c68206"           # st-parcial
greenColor = "#267f47"            # st-implementado
blueColor = "#00657f"
violetColor = "#786895"           # st-no_aplicable
grayColor = "#7a8187"             # st-no_verificado

[theme.light.sidebar]
backgroundColor = "#ffffff"       # surface
secondaryBackgroundColor = "#eff3f6"
borderColor = "#dbe1e4"           # rule

[theme.dark]
primaryColor = "#54bbd2"          # accent (texto oscuro encima: on-accent)
backgroundColor = "#0a0f13"       # paper
secondaryBackgroundColor = "#12181d"  # surface
textColor = "#eaeff3"             # ink
borderColor = "#343c42"           # rule-strong
linkColor = "#54bbd2"
redColor = "#f27166"
orangeColor = "#efb146"
greenColor = "#56bd78"
blueColor = "#54bbd2"
violetColor = "#ac9ad0"
grayColor = "#7a8187"

[theme.dark.sidebar]
backgroundColor = "#12181d"       # surface
secondaryBackgroundColor = "#0a0f13"
borderColor = "#232a2f"           # rule

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
